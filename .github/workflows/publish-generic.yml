name: Publish generic playbook
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-generic.yml']
permissions:
  contents: write
jobs:
  replace-public-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Replace case-specific content with a generic root commit
        env:
          CLEAN_PAYLOAD: 
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "chenpingan123456/elementor-mcp-migration-playbook"
          test "$(pwd -P)" = "$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          KEEP_WORKFLOW="$(mktemp)"
          cp .github/workflows/publish-generic.yml "$KEEP_WORKFLOW"
          git checkout --orphan generic-public-root >/dev/null 2>&1
          git rm -rf . >/dev/null
          python - <<'PY'
          import os, base64, zipfile, io
          from pathlib import Path
          root=Path.cwd().resolve()
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['CLEAN_PAYLOAD']))) as z:
              for name in z.namelist():
                  assert (root/name).resolve().is_relative_to(root)
              z.extractall(root)
          PY
          mkdir -p .github/workflows
          cp "$KEEP_WORKFLOW" .github/workflows/publish-generic.yml
          python -m pip install -q -r requirements.txt
          python verify.py
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add .
          git commit -q -m "Publish generic Elementor MCP migration playbook"
          git push --force-with-lease="refs/heads/main:$EXPECTED_HEAD" origin HEAD:main
